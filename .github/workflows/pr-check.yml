name: Pull Request Check

on:
  pull_request:
    branches:
      - main
  # runs everything, e.g. before a release
  workflow_dispatch:

jobs:
  # Decides what the PR needs (.github/scripts/affected-targets.sh): a docs-only PR
  # skips the jobs below, a PR that touches one target runs only that target's TCK.
  # Skipped jobs report success, so the required checks still pass (a workflow-level
  # paths-ignore would leave them pending).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      aws: ${{ steps.diff.outputs.aws }}
      azure: ${{ steps.diff.outputs.azure }}
      gcp: ${{ steps.diff.outputs.gcp }}
      springboot: ${{ steps.diff.outputs.springboot }}
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Find the affected targets
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$EVENT" = "pull_request" ]; then
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          cat changed.txt
          .github/scripts/affected-targets.sh < changed.txt > result.txt
        else
          printf 'code=true\naws=true\nazure=true\ngcp=true\nspringboot=true\n' > result.txt
        fi
        cat result.txt
        cat result.txt >> "$GITHUB_OUTPUT"

  archetype-test:
    name: Test Archetype with Terraform
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: latest  # or specify a version like "1.6.0"
        
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          
    # Install parent dependencies first if needed
    - name: Install parent dependencies
      run: mvn -B clean install -DskipTests
      
    - name: Run archetype integration tests
      working-directory: maven-archetype
      run: mvn -B clean integration-test
      
    # Optional: Upload test results and generated projects for debugging
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: archetype-test-results
        path: |
          maven-archetype/target/test-classes/projects/*/project/
          maven-archetype/target/surefire-reports/
        retention-days: 5
      
  build-and-validate:
    name: Build and Validate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build with Maven
      run: mvn clean install

    # The on-premise target needs no cloud account: run its TCK first, against the executable jar
    # that "mvn clean install" just built (test/system-tests/generator-springboot)
    - name: Run TCK for Spring Boot
      if: needs.changes.outputs.springboot == 'true'
      working-directory: test/system-tests/generator-springboot
      run: mvn -B -ntp exec:java

  # The cloud TCKs deploy into shared cloud accounts, partly with fixed resource
  # names: at most one run per cloud at a time (a newer run waits), but different
  # clouds run in parallel.
  tck-azure:
    name: TCK azure-terraform
    needs: [changes, build-and-validate]
    if: needs.changes.outputs.azure == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-tck-azure
      cancel-in-progress: false

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # the TCK container builds only the system test; install what it depends on
    - name: Install the modules the TCK needs
      run: mvn -B -ntp install -DskipTests -pl test/system-tests/generator-azure-terraform -am

    - name: Build TCK image for Azure
      uses: docker/build-push-action@v7.4.0
      with:
        file: test/system-tests/generator-azure-terraform/Dockerfile.dockerfile
        tags: cloudhopper-tck-azure

    - name: Run TCK for Azure
      uses: addnab/docker-run-action@v3
      env:
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        TF_VAR_azure_region: ${{ secrets.AZURE_REGION }}
      with:
        image: cloudhopper-tck-azure:latest
        options: |
          -v ${{ github.workspace }}:/workspace
          -v /home/runner/.m2:/root/.m2
          -w /workspace
          -e ARM_SUBSCRIPTION_ID
          -e ARM_CLIENT_ID
          -e ARM_CLIENT_SECRET
          -e ARM_TENANT_ID
          -e TF_VAR_azure_region
        run: |
          echo '🔍 Recompiling only system tests...'
          mvn -f /workspace/pom.xml install -DskipTests -pl test/system-tests/generator-azure-terraform &&
          echo '▶ Running TCK...'
          cd /workspace/test/system-tests/generator-azure-terraform/
          mvn exec:java \
            -Dexec.mainClass=eu.cloudhopper.mc.test.system.tests.generator.azure.terraform.TckLauncher \
            -Dexec.classpathScope=test

  # The cloud TCKs deploy into shared cloud accounts, partly with fixed resource
  # names: at most one run per cloud at a time (a newer run waits), but different
  # clouds run in parallel.
  tck-gcp:
    name: TCK gcp-terraform
    needs: [changes, build-and-validate]
    if: needs.changes.outputs.gcp == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-tck-gcp
      cancel-in-progress: false

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # the TCK container builds only the system test; install what it depends on
    - name: Install the modules the TCK needs
      run: mvn -B -ntp install -DskipTests -pl test/system-tests/generator-gcp-terraform -am

    - name: Build TCK image for GCP
      uses: docker/build-push-action@v7.4.0
      with:
        file: test/system-tests/generator-gcp-terraform/Dockerfile.dockerfile
        tags: cloudhopper-tck-gcp

    - name: Set up GCP credentials
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      run: echo "$GOOGLE_APPLICATION_CREDENTIALS" > "/home/runner/gcp-key.json"

    - name: Run TCK for GCP
      uses: addnab/docker-run-action@v3
      with:
        image: cloudhopper-tck-gcp:latest
        options: |
          -v ${{ github.workspace }}:/workspace
          -v /home/runner/.m2:/root/.m2
          -v /home/runner/gcp-key.json:/root/gcp-key.json
          -w /workspace
          -e GOOGLE_APPLICATION_CREDENTIALS=/root/gcp-key.json
          -e GOOGLE_CLOUD_PROJECT=cloudhopper-tck
          -e GCP_PROJECT_ID=cloudhopper-tck
          -e GCP_REGION=us-central1
          -e TF_VAR_cloudscheduler_service_account_email=${{ secrets.CLOUDSCHEDULER_SERVICE_ACCOUNT_EMAIL }}
        run: |
          echo '🔍 Recompiling only system tests...'
          mvn -f /workspace/pom.xml install -DskipTests -pl test/system-tests/generator-gcp-terraform &&
          echo '▶ Running TCK...'
          cd /workspace/test/system-tests/generator-gcp-terraform/
          mvn exec:java \
            -Dexec.mainClass=eu.cloudhopper.mc.test.system.tests.generator.gcp.terraform.TckLauncher \
            -Dexec.classpathScope=test

  # The cloud TCKs deploy into shared cloud accounts, partly with fixed resource
  # names: at most one run per cloud at a time (a newer run waits), but different
  # clouds run in parallel.
  tck-aws:
    name: TCK aws-terraform
    needs: [changes, build-and-validate]
    if: needs.changes.outputs.aws == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-tck-aws
      cancel-in-progress: false

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # the TCK container builds only the system test; install what it depends on
    - name: Install the modules the TCK needs
      run: mvn -B -ntp install -DskipTests -pl test/system-tests/generator-aws-terraform -am

    - name: Build TCK image for AWS
      uses: docker/build-push-action@v7.4.0
      with:
        file: test/system-tests/generator-aws-terraform/Dockerfile.dockerfile
        tags: cloudhopper-tck-aws

    - name: Run TCK for AWS
      uses: addnab/docker-run-action@v3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        # Unique per run and attempt, so leftovers of an aborted run never collide
        # with the names of the next one (bucket names allow at most 63 chars).
        TF_VAR_cloudhopper_name_prefix: ci-${{ github.run_id }}-${{ github.run_attempt }}-
      with:
        image: cloudhopper-tck-aws:latest
        options: |
          -v ${{ github.workspace }}:/workspace
          -v /home/runner/.m2:/root/.m2
          -w /workspace
          -e AWS_ACCESS_KEY_ID
          -e AWS_SECRET_ACCESS_KEY
          -e AWS_REGION
          -e TF_VAR_cloudhopper_name_prefix
        run: |
          echo '🔍 Recompiling only system tests...'
          mvn -f /workspace/pom.xml install -DskipTests -pl test/system-tests/generator-aws-terraform &&
          echo '▶ Running TCK...'
          cd /workspace/test/system-tests/generator-aws-terraform/
          mvn exec:java \
            -Dexec.mainClass=eu.cloudhopper.mc.test.system.tests.generator.aws.terraform.TckLauncher \
            -Dexec.classpathScope=test

name: Release

# A tag v<version> (e.g. v1.0.0) builds and tests that version, signs it with the Dukehoff release key, uploads all
# published modules, the archetype included, to Maven Central as one deployment and then creates the GitHub release.
# The version comes from the tag; the poms on main stay at -SNAPSHOT and nothing is committed or pushed to main.
# The Central upload waits for "Publish" in the Central Portal unless the variable CENTRAL_AUTO_PUBLISH is true.
#
# Started by hand (Actions > Release > Run workflow) it is always a dry run, even on a tag: the same build, tests
# and bundle check, signed if the key is available, without upload; the bundle is kept as a workflow artifact for
# 7 days. A release uploads exactly the bundle that was checked, through the Central Portal API.
#
# Secrets (organization dukehoff-gmbh): CENTRAL_USERNAME and CENTRAL_PASSWORD (a Central Portal user token),
# MAVEN_GPG_PRIVATE_KEY (the armored Dukehoff release key) and MAVEN_GPG_PASSPHRASE.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the dry run, e.g. 1.0.0'
        required: true
        default: '0.0.0-dryrun'

permissions:
  contents: write

# one group per tag, so a dry run queued later never replaces a pending release
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'dry-run' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      HAS_CENTRAL: ${{ secrets.CENTRAL_USERNAME != '' && secrets.CENTRAL_PASSWORD != '' }}
      HAS_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY != '' && secrets.MAVEN_GPG_PASSPHRASE != '' }}
    steps:
      - name: Secrets for a release
        if: env.RELEASE == 'true' && (env.HAS_CENTRAL != 'true' || env.HAS_KEY != 'true')
        run: |
          echo "::error::A release needs the secrets CENTRAL_USERNAME, CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE."
          exit 1

      - uses: actions/checkout@v7

      # also writes ~/.m2/settings.xml with the "central" server and imports the signing key, if present
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$RELEASE" = true ]; then version=${GITHUB_REF_NAME#v}; else version=$INPUT_VERSION; fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a version: $version"; exit 1; }
          case "$version" in *-SNAPSHOT) echo "::error::SNAPSHOT versions are not released: $version"; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # the archetype's generated pom takes its Cloudhopper version from project.version, so it follows along
      - name: Set the version
        run: mvn -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      # install, not verify: the archetype integration test builds the generated project against the local repository.
      # The cloud TCK runs on every pull request; it is not repeated here.
      - name: Build and test
        run: mvn -B -ntp clean install

      # builds the signed bundle exactly as it would be uploaded, without uploading it
      - name: Build the bundle
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          signing=; [ "$HAS_KEY" = true ] || signing=-Dgpg.skip
          mvn -B -ntp -Prelease deploy -DskipTests -DskipUpload=true $signing

      - name: Check the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bundle=target/central-publishing/central-bundle.zip
          unzip -Z1 "$bundle" | grep -v '/$' > entries.txt
          echo "$(wc -l < entries.txt) entries"
          # Central rejects a bundle with files outside the version folders
          if grep -vE "^eu/cloudhopper/mc/[a-z-]+/${VERSION//./\\.}/[^/]+$" entries.txt; then
            echo "::error::files outside the version folders (see above)"; exit 1
          fi
          artifacts=$(cut -d/ -f4 entries.txt | sort -u | tr '\n' ' ')
          expected="cloudhopper-maven-archetype-core cloudhopper-parent deployment-config-api deployment-config-generator-api deployment-config-generator-generic deployment-config-processor deployment-config-processor-test-support generator-aws-terraform generator-azure-terraform generator-gcp-terraform generator-knative generator-springboot provider-aws provider-azure provider-gcp provider-http provider-springboot test-tck-api "
          [ "$artifacts" = "$expected" ] || { echo "::error::unexpected artifacts: $artifacts"; exit 1; }
          # Central requires sources and javadoc for everything but the parent pom
          for a in $artifacts; do
            [ "$a" = cloudhopper-parent ] && continue
            for c in sources javadoc; do
              grep -qx "eu/cloudhopper/mc/$a/$VERSION/$a-$VERSION-$c.jar" entries.txt || { echo "::error::$a has no $c jar"; exit 1; }
            done
          done
          if [ "$HAS_KEY" = true ]; then
            missing=$(grep -E '\.(jar|pom)$' entries.txt | while read -r f; do grep -qx "$f.asc" entries.txt || echo "$f"; done)
            [ -z "$missing" ] || { echo "::error::not signed: $missing"; exit 1; }
            echo "all jars and poms signed"
          fi

      - name: Keep the bundle (dry run)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cloudhopper-${{ steps.version.outputs.version }}-bundle
          path: target/central-publishing/central-bundle.zip
          retention-days: 7

      # uploads the checked bundle itself instead of building it again, then waits for Central's validation
      - name: Upload to Maven Central
        if: env.RELEASE == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          AUTO_PUBLISH: ${{ vars.CENTRAL_AUTO_PUBLISH == 'true' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          api=https://central.sonatype.com/api/v1/publisher
          auth="Authorization: Bearer $(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          type=USER_MANAGED; [ "$AUTO_PUBLISH" = true ] && type=AUTOMATIC
          id=$(curl -sSf -X POST -H "$auth" -F bundle=@target/central-publishing/central-bundle.zip \
              "$api/upload?name=cloudhopper-$VERSION&publishingType=$type")
          echo "deployment $id ($type)"
          for i in $(seq 1 60); do
            status=$(curl -sSf -X POST -H "$auth" "$api/status?id=$id")
            state=$(echo "$status" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              VALIDATED) echo "::notice::Validated; publish deployment $id at https://central.sonatype.com/publishing/deployments"; exit 0 ;;
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) echo "$status" | jq .errors; echo "::error::Central rejected deployment $id"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::deployment $id not validated after 20 minutes"; exit 1

      - name: GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Dukehoff Cloudhopper ${VERSION}: write your cloud functions once, generate the deployment for AWS, Azure, GCP or Spring Boot.

          \`\`\`bash
          mvn archetype:generate \\
            -DarchetypeGroupId=eu.cloudhopper.mc \\
            -DarchetypeArtifactId=cloudhopper-maven-archetype-core \\
            -DarchetypeVersion=${VERSION}
          \`\`\`

          Maven Central has it about half an hour after it is published there.
          Documentation: https://cloudhopper.eu
          EOF
          prerelease=; case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Dukehoff Cloudhopper ${VERSION}" \
              --notes-file notes.md --generate-notes $prerelease
